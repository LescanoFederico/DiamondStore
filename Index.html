<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda de Botines</title>
  <link rel="stylesheet" href="Style.css">
</head>
<body>
  <header>
    <div class="Logo">
      <img src="./Imagenes/Diseño sin título_20250611_162735_0000.svg" alt="Diamond" class="logo-img" width="100px" height="90px">
    </div>

    <div>
      <a href="./Pantallas/Sesion.html">Iniciar Sesión</a>
      <a href="./Pantallas/Registro.html">Registrarse</a>
      <a href="./Pantallas/Carrito.html" id="carritoLink">Carrito (<span id="contadorCarrito">0</span>)</a>
    </div>
        
    
  </header>

  <script>
    function toggleMenu() {
      const menu = document.getElementById("menuOpciones");
      menu.style.display = menu.style.display === "block" ? "none" : "block";
    }
  </script>

  <div class="contenedor">
    <div class="Articulos"></div>
  </div>


  <script>
document.addEventListener("DOMContentLoaded", () => {

  const contenedorArticulos = document.querySelector(".Articulos");
  //Cargar productos desde la API
  fetch("api.php")
    .then(res => res.json())
    .then(data => {
      mostrarProductosPorMarca(data);
    })
    .catch(err => console.error("Error al cargar productos:", err));

  //Ordenar y mostrar por marcas

  function mostrarProductosPorMarca(productos) {

    contenedorArticulos.innerHTML = "";

    const marcas = {};

    productos.forEach(p => {
      if (!marcas[p.marca]) marcas[p.marca] = [];
      marcas[p.marca].push(p);
    });

    for (const marca in marcas) {

      const section = document.createElement("section");
      section.innerHTML = `<h1 class="Marca">${marca}</h1>`;
      
      marcas[marca].forEach(prod => {
        const caja = document.createElement("div");
        caja.classList.add("caja");
        caja.dataset.id = prod.id;

        caja.innerHTML = `
          <h1 class="Info">${prod.nombre}</h1>
          <img src="${prod.imagen ? prod.imagen : "./Imagenes/default.png"}" alt="${prod.nombre}">
          <p class="precio">$${prod.precio}</p>
          <button class="carrito">Agregar al carrito</button>
        `;

        section.appendChild(caja);
      });

      contenedorArticulos.appendChild(section);
    }

    activarBotonesCarrito();
  }
  //CARRITO

  function activarBotonesCarrito() {
    const botones = document.querySelectorAll(".carrito");
    const contador = document.getElementById("contadorCarrito");

    function actualizarContador() {
      const carrito = JSON.parse(localStorage.getItem("carrito")) || [];
      contador.textContent = carrito.reduce((acc, item) => acc + item.qty, 0);
    }

    function agregarAlCarrito(producto) {
      let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
      const existe = carrito.find(p => p.id == producto.id);

      if (existe) existe.qty++;
      else carrito.push(producto);

      localStorage.setItem("carrito", JSON.stringify(carrito));
      actualizarContador();
    }

    botones.forEach(btn => {
      btn.addEventListener("click", e => {
        const caja = e.target.closest(".caja");

        const producto = {
          id: caja.dataset.id,
          nombre: caja.querySelector(".Info").textContent,
          precio: parseFloat(caja.querySelector(".precio").textContent.replace("$", "")),
          img: caja.querySelector("img").src,
          qty: 1,
        };

        agregarAlCarrito(producto);
        alert(`✅ ${producto.nombre} agregado al carrito.`);
      });
    });

    actualizarContador();
  }

});
</script>
</body>
</html>
