<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="Formulario.css">
</head>
<body>

<header>
    <div class="Logo">
        <a href="../Index.html">
            <img src="../Imagenes/Diseño sin título_20250611_162735_0000.svg" 
                 alt="Diamond" class="logo-img" width="100px" height="90px">
        </a>
    </div>

    <div>
        <a href="../Index.html">Inicio</a>
        <a href="./Registro.html">Registrarse</a>
    </div>
</header>

<main class="main">
    <form class="Formulario" onsubmit="iniciarSesion(); return false;">
        <h2>Iniciar Sesión</h2>

        <input type="email" id="Correo" placeholder="Correo electrónico" required>
        <input type="password" id="Contrasena" placeholder="Contraseña" required>

        <button type="submit" class="btn">Ingresar</button>

        <p>¿No tenés cuenta? <a href="./Registro.html">Registrarse</a></p>
    </form>
</main>

<script>
    function iniciarSesion() {
        const data = {
            correo: document.getElementById("Correo").value,
            contraseña: document.getElementById("Contrasena").value
        };

        fetch("../api_login.php", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        })
        .then(res => res.json())
        .then(res => {
            if (res.status === "ok") {
                alert("Inicio de sesión exitoso ✔");
                window.location.href = "../Index.html";
            } else {
                alert("Error: " + res.msg);
            }
        })
        .catch(() => alert("Error en el servidor"));
    }
</script>

</body>
</html>
