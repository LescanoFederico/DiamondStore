<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito | Tienda de Botines</title>
  <link rel="stylesheet" href="./Carrito.css">
  <link rel="stylesheet" href="./carrito.js">
</head>

<body>
  <header>
        <div class="Logo">
            <a href="../Index.html">
                <img src="../Imagenes/Diseño sin título_20250611_162735_0000.svg" alt="Diamond" class="logo-img" width="100px" height="90px">
            </a>
            
        </div>
    </header>

  <main>
    <h1>Tu Carrito de Compras</h1>
    <div id="carritoContainer"></div>

    <div id="totalContainer">
      <h2>Total: $<span id="totalCarrito">0</span></h2>
      <button id="vaciarCarrito">Vaciar Carrito</button>
      <button id="comprar">Finalizar Compra</button>
    </div>
  </main>

<script>
    document.addEventListener("DOMContentLoaded", () => {
      const carritoContainer = document.getElementById("carritoContainer");
      const totalElement = document.getElementById("totalCarrito");
      const contador = document.getElementById("contadorCarrito");
      const btnVaciar = document.getElementById("vaciarCarrito");
      const btnComprar = document.getElementById("comprar");

      // --- Cargar productos ---
      function cargarCarrito() {
        const carrito = JSON.parse(localStorage.getItem("carrito")) || [];

        carritoContainer.innerHTML = "";

        if (carrito.length === 0) {
          carritoContainer.innerHTML = "<p>🛒 Tu carrito está vacío.</p>";
          totalElement.textContent = "0";
          contador.textContent = "0";
          return;
        }

        let total = 0;
        let cantidadTotal = 0;

        carrito.forEach((item, index) => {
          total += item.precio * item.qty;
          cantidadTotal += item.qty;

          const div = document.createElement("div");
          div.classList.add("item-carrito");
          div.innerHTML = `
            <img src="${item.img}" alt="${item.nombre}" width="100">
            <div class="info-carrito">
              <h3>${item.nombre}</h3>
              <p>Precio: $${item.precio.toLocaleString()}</p>
              <p>Cantidad: ${item.qty}</p>
              <p>Subtotal: $${(item.precio * item.qty).toLocaleString()}</p>
            </div>
          `;
          carritoContainer.appendChild(div);
        });

        totalElement.textContent = total.toLocaleString();
        contador.textContent = cantidadTotal;

        
      }

      // --- Vaciar carrito ---
      btnVaciar.addEventListener("click", () => {
        localStorage.removeItem("carrito");
        cargarCarrito();
      });

      // --- Simular compra ---
      btnComprar.addEventListener("click", () => {
        const carrito = JSON.parse(localStorage.getItem("carrito")) || [];
        if (carrito.length === 0) {
          alert("Tu carrito está vacío 🛒");
          return;
        }
        alert("✅ ¡Gracias por tu compra!");
        localStorage.removeItem("carrito");
        cargarCarrito();
      });

      cargarCarrito();
    });
  </script>
  
</body>
</html>
